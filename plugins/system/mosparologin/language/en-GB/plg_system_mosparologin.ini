PLG_SYSTEM_MOSPAROLOGIN="System - mosparo: logins"
PLG_SYSTEM_MOSPAROLOGIN_DESCRIPTION="Protect native Joomla password logins using the project configured in CAPTCHA - mosparo. Passwords are never sent to mosparo. Does not cover passkeys, remember-me cookies or third-party login endpoints."
PLG_SYSTEM_MOSPAROLOGIN_SITE="Protect site logins"
PLG_SYSTEM_MOSPAROLOGIN_SITE_DESC="Protect the Users login page and native Login modules. Configure and test CAPTCHA - mosparo first."
PLG_SYSTEM_MOSPAROLOGIN_ADMIN="Protect administrator login"
PLG_SYSTEM_MOSPAROLOGIN_ADMIN_DESC="Enable after a successful site test. Keep an administrator session open and retain filesystem or database access for recovery."
