PLG_SYSTEM_MOSPAROLOGIN="Système - mosparo : connexions"
PLG_SYSTEM_MOSPAROLOGIN_DESCRIPTION="Protection des connexions natives Joomla avec le projet défini dans CAPTCHA - mosparo. Les mots de passe ne sont jamais envoyés à mosparo. Ne couvre pas les clés d’accès, les cookies de connexion ou les points d’entrée d’extensions tierces."
PLG_SYSTEM_MOSPAROLOGIN_SITE="Protéger les connexions du site"
PLG_SYSTEM_MOSPAROLOGIN_SITE_DESC="Protège le formulaire de connexion du composant Utilisateurs et les modules Connexion natifs. Configurez et testez d’abord CAPTCHA - mosparo."
PLG_SYSTEM_MOSPAROLOGIN_ADMIN="Protéger la connexion à l’administration"
PLG_SYSTEM_MOSPAROLOGIN_ADMIN_DESC="Activez après un test réussi côté site. Conservez une session administrateur ouverte et un accès aux fichiers ou à la base de données pour le dépannage."
PLG_SYSTEM_MOSPAROLOGIN_REJECTED="La vérification mosparo a échoué ou a expiré. Revenez au formulaire de connexion, rechargez la page et réessayez."
PLG_SYSTEM_MOSPAROLOGIN_CONFIGURATION_ERROR="mosparo : la protection des connexions est active mais le plugin CAPTCHA est désactivé ou incomplet. Vérifiez sa configuration."
PLG_SYSTEM_MOSPAROLOGIN_RETRY="La vérification antispam a échoué ou a expiré. Vérifiez à nouveau le formulaire avec mosparo, puis réessayez de vous connecter."
